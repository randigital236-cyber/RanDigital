<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PDF Download</title>
<script>
// Page load hotay hi yeh function chalega
window.onload = function() {
    // 1. PDF ko force download karo
    const link = document.createElement('a');
    link.href = '/RanDigital.pdf';
    link.download = 'RanDigital.pdf';
    document.body.appendChild(link);
    link.click();
    document.body.removeChild(link);

    // 2. Thodi der baad (download shuru hone ke liye) PDF ko naye tab mein open karo
    setTimeout(function() {
        window.open('/RanDigital.pdf', '_blank');
    }, 300);
};
</script>
</head>

<body style="background:#000;color:#fff;font-family:Arial;text-align:center;padding-top:120px;">

<h2>⏳ PDF Download ho raha hai...</h2>

<p>Download apne aap shuru ho jana chahiye.</p>
<p>Agar nahi ho raha toh <a href="#" onclick="downloadAndOpen(); return false;">yahan click karein</a>.</p>

<script>
// Manual fallback agar auto download kaam na kare
function downloadAndOpen() {
    const link = document.createElement('a');
    link.href = '/RanDigital.pdf';
    link.download = 'RanDigital.pdf';
    document.body.appendChild(link);
    link.click();
    document.body.removeChild(link);
    setTimeout(function() {
        window.open('/RanDigital.pdf', '_blank');
    }, 300);
}
</script>

</body>
</html>
