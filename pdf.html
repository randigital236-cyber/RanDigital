<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PDF</title>
</head>
<body style="background:#000;color:#fff;font-family:Arial;text-align:center;padding-top:120px;">

<h2>📄 PDF</h2>

<!-- Ek hi link - dono kaam ek saath -->
<a href="#" onclick="openAndDownload(); return false;" style="color:#007bff;font-size:20px;text-decoration:none;border:2px solid #007bff;padding:12px 30px;border-radius:8px;display:inline-block;">
    📥 PDF Open & Download
</a>

<p id="status" style="margin-top:20px;color:#aaa;">Click karein</p>

<script>
function openAndDownload() {
    // PDF open karo
    window.open('/RanDigital.pdf', '_blank');
    
    // Status update
    document.getElementById('status').textContent = '✅ PDF open ho gayi! Download bhi shuru...';
    document.getElementById('status').style.color = '#28a745';
    
    // Download bhi shuru karo (with tiny delay)
    setTimeout(function() {
        const link = document.createElement('a');
        link.href = '/RanDigital.pdf';
        link.download = 'RanDigital.pdf';
        document.body.appendChild(link);
        link.click();
        document.body.removeChild(link);
    }, 300);
}
</script>

</body>
</html>
