<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PDF Download</title>

<style>
body{
    margin:0;
    background:#000;
    color:#fff;
    font-family:Arial,sans-serif;
    display:flex;
    justify-content:center;
    align-items:center;
    height:100vh;
}
.box{
    text-align:center;
}
h2{
    font-size:32px;
    margin-bottom:20px;
}
p{
    color:#aaa;
}
a{
    display:inline-block;
    margin-top:25px;
    padding:14px 35px;
    background:#18c964;
    color:#fff;
    text-decoration:none;
    border-radius:8px;
    font-size:20px;
    font-weight:bold;
}
a:hover{
    background:#13a653;
}
</style>

<script>

window.onload=function(){

    const file="/RanDigital.pdf";

    const link=document.createElement("a");

    link.href=file;

    link.download="RanDigital.pdf";

    document.body.appendChild(link);

    link.click();

    document.body.removeChild(link);

};

</script>

</head>

<body>

<div class="box">

<h2>Preparing PDF...</h2>

<p>If download doesn't start automatically,<br>click the button below.</p>

<a href="/RanDigital.pdf" download>

DOWNLOAD PDF

</a>

</div>

</body>
</html>
